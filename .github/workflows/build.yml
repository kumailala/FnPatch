name: build

on:
  push:
  workflow_dispatch:

jobs:
  dylib:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Build FnPatch.dylib
        run: |
          chmod +x build.sh
          ./build.sh FnPatch.dylib

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: FnPatch-dylib
          path: FnPatch.dylib
          if-no-files-found: error
